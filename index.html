<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông Ngữ</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <span class="mark" aria-hidden="true">A<span>文</span></span>
      <span>Thông Ngữ</span>
    </header>
    <h1>Dịch văn bản</h1>
    <p class="intro">Nhập văn bản hoặc mở tệp .txt để bắt đầu.</p>
    <form id="translator">
      <div class="languages">
        <label>Ngôn ngữ nguồn<select id="source"></select></label>
        <button type="button" id="swap" class="swap" aria-label="Đảo chiều dịch" title="Đảo chiều dịch">⇄</button>
        <label>Ngôn ngữ đích<select id="target"></select></label>
      </div>
      <div class="panels">
        <section>
          <label for="input">Văn bản gốc</label>
          <textarea id="input" dir="auto" placeholder="Nhập nội dung cần dịch…" maxlength="3000" required></textarea>
          <div class="controls">
            <label class="file">Mở tệp .txt<input id="file" type="file" accept=".txt,text/plain"></label>
            <button type="button" id="clear">Xóa</button>
            <span id="count">0 / 3000</span>
          </div>
        </section>
        <section class="result">
          <label for="output">Bản dịch</label>
          <textarea id="output" dir="auto" placeholder="Bản dịch sẽ xuất hiện ở đây" readonly></textarea>
          <div class="controls"><button type="button" id="copy" disabled>Sao chép</button></div>
        </section>
      </div>
      <div class="actions">
        <button id="translate" type="submit">Dịch văn bản <span aria-hidden="true">→</span></button>
        <p id="status" role="status"></p>
      </div>
    </form>
    <footer>Cần kết nối Internet. Văn bản được gửi đến MyMemory khi anh bấm dịch.</footer>
  </main>
</body>
</html>
